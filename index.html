<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Fathya & Nauval's Wedding</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #0a0a0a;
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        position: relative;
      }

      /* Mobile phone container */
      .phone-frame {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        background: linear-gradient(
          180deg,
          #3d2e2a 0%,
          #2e2422 10%,
          #231c1a 22%,
          #181414 38%,
          #111010 55%,
          #0a0908 75%,
          #050505 100%
        );
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Subtle romantic bokeh / light effects */
      .phone-frame::before {
        content: "";
        position: absolute;
        top: -20%;
        left: -30%;
        width: 80%;
        height: 60%;
        background: radial-gradient(
          ellipse at center,
          rgba(180, 130, 100, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      .phone-frame::after {
        content: "";
        position: absolute;
        bottom: -10%;
        right: -20%;
        width: 60%;
        height: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(29, 185, 84, 0.03) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      .welcome-container {
        padding: 30px 24px;
        max-width: 600px;
        width: 100%;
        position: relative;
        z-index: 1;
        animation: fadeInUp 1s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-height: 100vh;
        overflow-y: auto;
        gap: 4px;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Spotify logo area */
      .spotify-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 40px;
        animation: fadeIn 1.5s ease-out;
      }

      .spotify-icon {
        width: 40px;
        height: 40px;
        fill: #ffffff;
      }

      .spotify-text {
        font-size: 1.5em;
        font-weight: 700;
        letter-spacing: -1px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Wedding Header — "THE WEDDING OF" label */
      .playlist-header {
        animation: fadeIn 1s ease-out;
        text-align: center;
        margin-bottom: 8px;
      }

      .playlist-header .label {
        display: block;
        font-size: 0.65em;
        font-weight: 500;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        font-variant: small-caps;
      }

      /* Couple names — main visual focus */
      .couple-names {
        animation: fadeIn 1s ease-out 0.2s both;
        text-align: center;
        margin-bottom: 24px;
        line-height: 1.2;
      }

      .couple-names .name {
        display: block;
        font-size: 2.2em;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -1px;
      }

      .couple-names .ampersand {
        display: block;
        font-size: 1em;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.35);
        margin: 2px 0;
        letter-spacing: 3px;
      }

      /* Album cover styling — slightly smaller */
      .album-wrapper {
        perspective: 1000px;
        margin-bottom: 28px;
        animation: scaleIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.4s both;
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .album-container {
        position: relative;
        display: inline-block;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
      }

      .cover-image {
        width: 200px;
        height: 200px;
        border-radius: 10px;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }

      .album-container:hover .cover-image {
        transform: scale(1.03);
      }

      /* Vinyl record effect */
      .vinyl-effect {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 10px;
        top: 0;
        left: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.04) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      /* Guest section */
      .welcome-text {
        font-size: 0.72em;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.4);
        font-weight: 400;
        letter-spacing: 3px;
        text-transform: uppercase;
        animation: fadeIn 1s ease-out 0.6s both;
      }

      .guest-name {
        font-size: 1.4em;
        margin: 4px 0 0;
        font-weight: 700;
        color: #ffffff;
        animation: fadeIn 1s ease-out 0.8s both;
        line-height: 1.3;
      }

      .divider {
        width: 40px;
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 18px auto;
        border-radius: 1px;
        animation: expandWidth 1s ease-out 1s both;
      }

      @keyframes expandWidth {
        from {
          width: 0;
        }
        to {
          width: 50px;
        }
      }

      .invitation-text {
        font-size: 0.8rem;
        line-height: 1.7;
        margin: 0 auto 6px;
        color: rgba(255, 255, 255, 0.55);
        font-weight: 300;
        max-width: 320px;
        animation: fadeIn 1s ease-out 1.1s both;
        letter-spacing: 0.3px;
      }

      /* Open Invitation button */
      .open-btn {
        background: #1db954;
        color: #000;
        border: none;
        padding: 15px 50px;
        border-radius: 50px;
        font-size: 0.82rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        box-shadow: 0 4px 20px rgba(29, 185, 84, 0.25);
        animation: fadeIn 1s ease-out 1.3s both;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

      .open-btn:hover {
        transform: scale(1.04);
        background: #1ed760;
        box-shadow: 0 6px 28px rgba(29, 185, 84, 0.35);
      }

      .open-btn:active {
        transform: scale(0.97);
      }

      /* Play icon */
      .play-icon {
        width: 0;
        height: 0;
        border-left: 10px solid #000;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        margin-left: 2px;
      }

      /* Info badge */
      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 8px 20px;
        border-radius: 20px;
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.35);
        margin-top: 20px;
        font-weight: 400;
        letter-spacing: 1px;
        animation: fadeIn 1s ease-out 1.5s both;
      }

      /* Responsive adjustments */
      @media (max-width: 480px) {
        .couple-names .name {
          font-size: 2em;
        }

        .spotify-text {
          font-size: 1.2em;
        }

        .invitation-text {
          font-size: 0.8rem;
        }
      }

      @media (max-height: 700px) {
        .welcome-container {
          padding: 16px 20px;
          gap: 2px;
        }

        .couple-names {
          margin-bottom: 16px;
        }

        .couple-names .name {
          font-size: 1.7em;
        }

        .cover-image {
          width: 170px;
          height: 170px;
        }

        .vinyl-effect {
          width: 170px;
          height: 170px;
        }

        .album-wrapper {
          margin-bottom: 20px;
        }

        .spotify-logo {
          margin-bottom: 20px;
        }

        .welcome-text {
          font-size: 0.65em;
          margin-bottom: 4px;
        }

        .guest-name {
          font-size: 1.2em;
        }

        .divider {
          margin: 12px auto;
        }

        .invitation-text {
          font-size: 0.75rem;
          margin: 0 auto 4px;
        }

        .open-btn {
          margin-top: 16px;
          padding: 12px 40px;
          font-size: 0.78rem;
        }

        .badge {
          margin-top: 12px;
          font-size: 0.65rem;
          padding: 6px 16px;
        }
      }

      @media (max-height: 600px) {
        .couple-names .name {
          font-size: 1.5em;
        }

        .couple-names .ampersand {
          font-size: 0.85em;
          margin: 0;
        }

        .cover-image {
          width: 140px;
          height: 140px;
        }

        .vinyl-effect {
          width: 140px;
          height: 140px;
        }

        .album-wrapper {
          margin-bottom: 14px;
        }

        .playlist-header {
          margin-bottom: 4px;
        }

        .couple-names {
          margin-bottom: 10px;
        }

        .open-btn {
          margin-top: 12px;
          padding: 10px 36px;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="welcome-container">
        <!-- Header Label -->
        <div class="playlist-header">
          <span class="label">The Wedding of</span>
        </div>

        <!-- Couple Names — Main Focus -->
        <div class="couple-names">
          <span class="name">Fathya</span>
          <span class="ampersand">&</span>
          <span class="name">Nauval</span>
        </div>

        <!-- Album Cover -->
        <div class="album-wrapper">
          <div class="album-container">
            <img
              src="assets/cover.png"
              alt="Wedding Cover"
              class="cover-image"
            />
            <div class="vinyl-effect"></div>
          </div>
        </div>

        <!-- Guest Info -->
        <div class="welcome-text">Dear,</div>
        <div class="guest-name" id="guestName"></div>

        <div class="divider"></div>

        <div class="invitation-text">
          You are cordially invited to celebrate<br />
          our special day of love and joy
        </div>

        <!-- Open Button -->
        <a href="main.html" class="open-btn">
          <div class="play-icon"></div>
          <span>Open Invitation</span>
        </a>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Get the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get("to") || "Guest";

        // Update the Open Invitation link
        const openBtn = document.querySelector(".open-btn");
        if (openBtn) {
          openBtn.href = `main.html?to=${encodeURIComponent(name)}&autoplay=true`;
        }

        // Format and display the name
        const formattedName = name
          .split(/[\s+]+/)
          .map(
            (word) =>
              word.charAt(0).toUpperCase() + word.slice(1).toLowerCase(),
          )
          .join(" ");

        document.getElementById("guestName").textContent = formattedName;
      });
    </script>
  </body>
</html>
